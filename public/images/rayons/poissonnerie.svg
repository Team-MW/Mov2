<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Visuel provisoire du rayon Poissonnerie — à remplacer par une photo du rayon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FA3AE"/>
      <stop offset="1" stop-color="#0C5C65"/>
